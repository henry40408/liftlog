name: CI

on:
  push:
    branches: [main, feature/*]
  pull_request:
    branches: [main]

# One run per ref at a time. A newer push supersedes the run it interrupted;
# a tag does not — a tagged build publishes one specific version and nothing
# should quietly cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Cache dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --verbose

      - uses: taiki-e/install-action@8c6986fc38d22c217606a7ad4f1d438eced263e0 # nextest
        if: runner.os != 'Linux'

      - name: Run tests
        if: runner.os != 'Linux'
        run: cargo nextest run

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@b8cecb83565409bcc297b2df6e77f030b2a468d5 # v2
        with:
          tool: cargo-deny@0.18.9
      - name: cargo deny check
        run: cargo deny check

  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history so build.rs `git describe` resolves a tagged version

      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          # `e2e` is its own workspace, deliberately outside the root one, so it
          # has to be named or none of its dependencies are cached.
          workspaces: |
            .
            e2e
          # This job builds the server with the dev profile, unlike the release
          # builds elsewhere. A cache key is only ever written once — an exact
          # hit is restored and never re-saved — so without a key of its own
          # this job would keep restoring whatever profile populated the key
          # first and rebuild its dependencies every run.
          key: dev

      # The suite starts this binary itself; building it here keeps the compile
      # off the test's own startup timeout.
      - name: Build server
        run: cargo build

      # `e2e` is linted here rather than in build-and-test, so it shares the
      # build this job already pays for. It is deliberately outside
      # `cargo deny`: the browser stack pulls in licences the server's
      # allow-list does not carry, and none of it is distributed — the Docker
      # image contains the server alone.
      - name: Check E2E formatting
        working-directory: e2e
        run: cargo fmt --all -- --check

      - name: Run clippy on E2E
        working-directory: e2e
        run: cargo clippy --all-targets -- -D warnings

      # No browser install step: thirtyfour's driver manager downloads a
      # matching chromedriver on demand, and the runner image already ships
      # Chrome. Nothing here needs Node.
      - name: Run E2E tests
        working-directory: e2e
        run: cargo test --test e2e

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # cargo-llvm-cov installs the llvm-tools-preview component itself, so the
      # toolchain needs no extra declaration beyond rust-toolchain.toml.

      - name: Cache dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - uses: taiki-e/install-action@ad25acb6b9413207b3174a4202c12aa9133691c6 # cargo-llvm-cov

      - uses: taiki-e/install-action@8c6986fc38d22c217606a7ad4f1d438eced263e0 # nextest

      - name: Generate coverage
        run: cargo llvm-cov nextest --lcov --output-path lcov.info

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: henry40408/liftlog
          files: lcov.info
          fail_ci_if_error: ${{ github.actor != 'dependabot[bot]' }}
