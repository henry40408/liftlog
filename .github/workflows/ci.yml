name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push cancels the running one for the same ref; tag runs never are.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # The licence allow-list lives in this job, once for the root module and once
  # for `e2e/`, which alone may also use MPL-2.0 (godog brings it in). go-licenses
  # reports standard-library packages as "does not have module info" unless
  # GOROOT is set explicitly, and `--include_tests` is what makes it see the
  # test-only dependencies of `e2e/`.
  deps:
    name: deps
    runs-on: ubuntu-latest
    env:
      ALLOWED_LICENSES: Apache-2.0,BSD-2-Clause,BSD-3-Clause,ISC,MIT,MIT-0,Zlib,Unlicense,CC0-1.0,Unicode-3.0,BSL-1.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: go mod tidy -diff
      - run: |
          go mod vendor
          test -z "$(git status --porcelain -- vendor go.mod go.sum)"
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - run: |
          GOROOT="$(go env GOROOT)" go run github.com/google/go-licenses/v2@v2.0.1 check ./... \
            --include_tests --allowed_licenses="$ALLOWED_LICENSES"
      # `e2e/` is a separate Go module with its own vendor directory.
      - run: go mod tidy -diff
        working-directory: e2e
      - run: |
          go mod vendor
          test -z "$(git status --porcelain -- vendor go.mod go.sum)"
        working-directory: e2e
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
        working-directory: e2e
      # `--ignore` skips the e2e module itself, which has no licence file.
      - run: |
          GOROOT="$(go env GOROOT)" go run github.com/google/go-licenses/v2@v2.0.1 check ./... \
            --include_tests --ignore github.com/henry40408/liftlog/e2e \
            --allowed_licenses="$ALLOWED_LICENSES,MPL-2.0"
        working-directory: e2e

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # The action only installs the binary: it always runs `golangci-lint run`,
      # which cannot do `fmt`. No `version:` input, so the action picks the
      # linter release itself and dependabot only tracks the action.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          install-only: true
      - run: golangci-lint fmt --diff ./...
      - run: golangci-lint run ./...
      # `e2e/` is a separate Go module, which `./...` above does not enter.
      - run: golangci-lint fmt --diff ./...
        working-directory: e2e
      - run: golangci-lint run ./...
        working-directory: e2e
      # CI and the Dockerfile read the Go version from the root go.mod only, so
      # the nested module must not drift from it.
      - run: |
          root="$(grep -E '^(go|toolchain) ' go.mod)"
          nested="$(grep -E '^(go|toolchain) ' e2e/go.mod)"
          test "$root" = "$nested" || { echo "e2e/go.mod differs from go.mod:"; echo "$root"; echo "--"; echo "$nested"; exit 1; }

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: go test -mod=vendor -race ./...

  # One job, so the required check stays named `mutation`. Pushes to main run
  # every mutant (about 8 minutes on 10 cores, expect 20-25 on this 4-vCPU
  # runner); pull requests only mutate the lines they change. The efficacy
  # threshold, `--timeout-coefficient` and the `e2e/` and `vendor/` exclusions
  # live in .gremlins.yaml: gremlins v0.6.0 ignores `--threshold-efficacy` on
  # the command line, so never pass it here. The run fails when efficacy is at
  # or below 95%.
  mutation:
    name: mutation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # --diff runs `git diff --merge-base`, which needs the history.
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # Gremlins derives each mutant's timeout from how long its coverage run
      # took. A cached test result makes that near zero, so nearly every mutant
      # "times out", which the efficacy score ignores: the job would pass
      # without testing anything.
      - run: go clean -testcache
      - if: github.event_name == 'push'
        run: |
          go run github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0 unleash .
      - if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Gremlins treats an empty diff as "everything changed" and would run
          # the full suite.
          if git diff --merge-base --quiet "origin/$BASE_REF"; then
            echo "No changes against $BASE_REF; nothing to mutate."
            exit 0
          fi
          status=0
          go run github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0 unleash \
            --diff "origin/$BASE_REF" . > "$RUNNER_TEMP/mutation.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/mutation.log"
          # A diff with no mutable Go line (docs, CI only) yields zero mutants,
          # which gremlins scores as 0% and so fails the threshold. That is not
          # a low score, so treat it as a pass.
          if [ "$status" -ne 0 ] \
            && grep -q '^Killed: 0, Lived: 0, Not covered: 0$' "$RUNNER_TEMP/mutation.log" \
            && grep -q '^Timed out: 0, ' "$RUNNER_TEMP/mutation.log"; then
            echo "No mutants in the changed lines; nothing to test."
            exit 0
          fi
          exit "$status"

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # `-coverprofile` ignores the binary cmd/liftlog's TestMain execs; with
      # LIFTLOG_COVERDIR set it builds that binary with `-cover`.
      - run: |
          LIFTLOG_COVERDIR="$PWD/covdata" go test -mod=vendor -coverprofile=coverage.out ./...
          go tool covdata textfmt -i=covdata -o coverage-bin.out
          tail -n +2 coverage-bin.out >> coverage.out
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: henry40408/liftlog
          files: coverage.out
          fail_ci_if_error: ${{ github.actor != 'dependabot[bot]' }}

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history so the VCS-stamped version resolves
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # Prebuild the server the suite launches, keeping the compile off its
      # timeout.
      - run: go build -mod=vendor -o bin/liftlog ./cmd/liftlog
      # The runner ships Chrome; chromedp starts it itself, so no driver is needed.
      # Pinned, because chromedp's own search would pick the runner's Chromium
      # snapshot ahead of google-chrome.
      - run: google-chrome --version
      - run: go test -count=1 -v -timeout 15m ./...
        working-directory: e2e
        env:
          E2E_CHROME: /usr/bin/google-chrome

  lint-workflow:
    name: lint-workflow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # install-action has no actionlint manifest, so download the release and
      # verify its checksum.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "$archive" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "$archive" actionlint
      - run: ./actionlint
