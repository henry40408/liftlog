[package]
name = "liftlog"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }
askama = "0.16"
# Capped: 0.3.52 broke cookie 0.18.1 (#118); later releases keep a deprecated
# shim time plans to drop. Raise the cap only after checking cookie still builds.
time = ">=0.3.53, <0.3.56"
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"
axum-extra = { version = "0.12", features = ["cookie"] }
argon2 = "0.6"
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4.6", features = ["derive", "env"] }
dotenvy = "0.15"
thiserror = "2"
anyhow = "1"
mimalloc = "0.1"
zxcvbn = { version = "3.1.1", default-features = false }
tower-http = { version = "0.7", features = ["csrf"] }

[dev-dependencies]
tokio-test = "0.4"
http-body-util = "0.1"
http = "1"
tower = { version = "0.5", features = ["util"] }

[build-dependencies]
resvg = "0.48"

[profile.release]
lto = true
strip = true
codegen-units = 1

[lints.rust]
unexpected_cfgs = "deny"
unsafe_code = "deny"

[lints.clippy]
# Priority -1 so the entries below win.
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Opt out of the noisy / low-signal pedantic lints.
cast_lossless = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
duration_suboptimal_units = "allow"
items_after_statements = "allow"
many_single_char_names = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
needless_pass_by_value = "allow"
return_self_not_must_use = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
struct_field_names = "allow"
too_many_lines = "allow"

# Restriction lints.
dbg_macro = "warn"
exit = "warn"
float_cmp_const = "warn"
lossy_float_literal = "warn"
map_err_ignore = "warn"
mem_forget = "warn"
rest_pat_in_fully_bound_structs = "warn"
string_add = "warn"
todo = "warn"
unimplemented = "warn"
verbose_file_reads = "warn"

# Nursery picks (the group is too unstable to enable whole).
debug_assert_with_mut_call = "warn"
fallible_impl_from = "warn"
trait_duplication_in_bounds = "warn"
