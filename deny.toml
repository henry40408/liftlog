[graph]
# Include optional features' dependencies too.
all-features = true

[advisories]
version = 2
# `ignore`: reviewed and accepted advisory IDs.
yanked = "deny"
ignore = [
    # basic-toml is unmaintained and has no patched version; askama_derive still
    # depends on it. Remove once askama drops it. Tracked in #214.
    "RUSTSEC-2026-0374",
    # libsqlite3-sys bundles a vulnerable SQLite (CVE-2026-119375); the fix needs
    # rusqlite 0.41, which r2d2_sqlite 0.36.0 (cooldown ends 2026-11-16) supports.
    # Remove after upgrading. Tracked in #233.
    "RUSTSEC-2026-0459",
    # pin-utils is unmaintained with no safe upgrade; pulled in by hyper 1.8.1.
    # Remove once hyper drops it. Tracked in #232.
    "RUSTSEC-2026-0441",
]

[licenses]
version = 2
# Permissive licenses only; review the crate before adding one.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
# crates.io only.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
