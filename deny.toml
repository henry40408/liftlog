[graph]
# Include optional features' dependencies too.
all-features = true

[advisories]
version = 2
# `ignore`: reviewed and accepted advisory IDs.
yanked = "deny"
ignore = [
    # basic-toml is unmaintained and has no patched version; askama_derive still
    # depends on it. Remove once askama drops it. Tracked in #214.
    "RUSTSEC-2026-0374",
    # ctutils 0.4.2 (transitive, via argon2/blake2/digest and phc) is fixed in
    # 0.4.4, published 2026-10-23 01:04 UTC; the 168-hour dependency cooldown
    # ends 2026-10-30 01:04 UTC. Upgrade to 0.4.4 and remove then.
    # Tracked in #222.
    "RUSTSEC-2026-0385",
]

[licenses]
version = 2
# Permissive licenses only; review the crate before adding one.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
# crates.io only.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
