[package]
name = "liftlog-e2e"
version = "0.0.0"
edition = "2024"
publish = false
description = "Browser E2E tests for LiftLog"

# Its own workspace, so root builds (coverage included) never compile the
# browser stack.
[workspace]

[dependencies]
anyhow = "1.0.102"
cucumber = "0.23.0"
# Plain HTTP to 127.0.0.1 only, so no TLS.
reqwest = { version = "0.13.4", default-features = false, features = ["cookies", "form"] }
serde_json = "1.0.145"
thirtyfour = "0.37.5"
tokio = { version = "1.53.1", features = ["macros", "process", "rt-multi-thread", "sync", "time"] }

[[test]]
name = "e2e"
harness = false

# Copied from the root lint set; nothing is inherited across workspaces.
[lints.rust]
unexpected_cfgs = "deny"
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

cast_lossless = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
# Deliberate departure: prose names like WebDriver/XPath would need backticks.
doc_markdown = "allow"
duration_suboptimal_units = "allow"
items_after_statements = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
needless_pass_by_value = "allow"
similar_names = "allow"
too_many_lines = "allow"

dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
